<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     role="img" aria-label="A fog gate: a stone archway with gold mist standing in it">
  <!-- The fog gate. You walk through it knowing nothing and die in ninety
       seconds; the deck's whole argument starts on the other side of it.
       Literal hex, like card.svg: a background-image is an isolated document
       and cannot read the page's brand custom properties. Slop palette.
       NB: an XML comment may not contain a double hyphen, so the token names
       cannot be written out here at all. -->
  <defs>
    <radialGradient id="t-vignette" cx="62%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#1c1610"/>
      <stop offset="62%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#070605"/>
    </radialGradient>

    <linearGradient id="t-fog" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b97d1c" stop-opacity="0.92"/>
      <stop offset="38%" stop-color="#b97d1c" stop-opacity="0.55"/>
      <stop offset="78%" stop-color="#8a5c13" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8a5c13" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="t-stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#241d16"/>
      <stop offset="45%" stop-color="#15110d"/>
      <stop offset="100%" stop-color="#0f0c09"/>
    </linearGradient>

    <linearGradient id="t-shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b97d1c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b97d1c" stop-opacity="0"/>
    </linearGradient>

    <!-- Mist: banded turbulence pushed around so the fog has grain rather
         than reading as a flat gradient wash. -->
    <filter id="t-mist" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.028" numOctaves="4" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="t-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <!-- The doorway opening: arch over a rectangle, reused as a clip. -->
    <clipPath id="t-doorway">
      <path d="M 892 900 L 892 388 A 174 174 0 0 1 1240 388 L 1240 900 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#t-vignette)"/>

  <!-- Floor plane, so the arch is standing on something. -->
  <rect x="0" y="742" width="1600" height="158" fill="#0a0806"/>
  <rect x="0" y="740" width="1600" height="2" fill="#2a2119"/>

  <!-- The glow the gate throws into the room, behind the stonework. -->
  <ellipse cx="1066" cy="690" rx="330" ry="120" fill="#b97d1c" opacity="0.14" filter="url(#t-soft)"/>

  <!-- Fog standing in the opening. -->
  <g clip-path="url(#t-doorway)">
    <rect x="860" y="200" width="420" height="700" fill="url(#t-fog)" filter="url(#t-mist)"/>
    <rect x="860" y="200" width="420" height="700" fill="url(#t-fog)" opacity="0.4"/>
  </g>

  <!-- Stonework: two piers and the arch ring, drawn as the frame around the
       opening rather than as blocks, so the fog is the only lit thing. -->
  <path fill="url(#t-stone)" d="
    M 820 900 L 820 372 A 246 246 0 0 1 1312 372 L 1312 900 L 1240 900 L 1240 388
    A 174 174 0 0 0 892 388 L 892 900 Z"/>
  <path fill="none" stroke="#332619" stroke-width="3" d="
    M 892 900 L 892 388 A 174 174 0 0 1 1240 388 L 1240 900"/>

  <!-- Voussoirs: the joints in the arch ring, faint. -->
  <g stroke="#2b2017" stroke-width="2" opacity="0.85">
    <path d="M 826 500 L 898 512"/>
    <path d="M 846 424 L 914 448"/>
    <path d="M 892 356 L 948 400"/>
    <path d="M 962 306 L 994 372"/>
    <path d="M 1066 288 L 1066 362"/>
    <path d="M 1170 306 L 1138 372"/>
    <path d="M 1240 356 L 1184 400"/>
    <path d="M 1286 424 L 1218 448"/>
    <path d="M 1306 500 L 1234 512"/>
  </g>

  <!-- Two shafts of light leaning out of the opening. -->
  <path d="M 940 420 L 820 900 L 980 900 L 1010 420 Z" fill="url(#t-shaft)" opacity="0.5"/>
  <path d="M 1150 430 L 1300 900 L 1150 900 L 1120 430 Z" fill="url(#t-shaft)" opacity="0.35"/>

  <!-- Motes drifting in the light. -->
  <g fill="#d9a441">
    <circle cx="986" cy="600" r="2.4" opacity="0.55"/>
    <circle cx="1042" cy="528" r="1.8" opacity="0.4"/>
    <circle cx="1128" cy="646" r="2.1" opacity="0.5"/>
    <circle cx="1094" cy="452" r="1.5" opacity="0.32"/>
    <circle cx="954" cy="712" r="1.9" opacity="0.42"/>
    <circle cx="1188" cy="574" r="1.6" opacity="0.3"/>
    <circle cx="1016" cy="676" r="1.4" opacity="0.36"/>
  </g>
</svg>
