<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 720" width="512" height="720"
     role="img" aria-label="A training-mode dummy above a five-input combo string, with a three-frame link window marked on a one-second ruler of sixty ticks">
  <!-- The panel for the fighting game. Everything here is precise and
       measurable and happens inside one second, and none of it tells you
       whether the combo was worth learning. That answer is days away, in a
       real match, which is the loop this slide is about. -->
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b3226"/>
      <stop offset="52%" stop-color="#2a2319"/>
      <stop offset="100%" stop-color="#191511"/>
    </linearGradient>
    <filter id="f-spark" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="720" fill="url(#f-bg)"/>

  <!-- Training room: a back wall you can see, and a floor in perspective.
       The panel has to read as a place at a glance from the back of a
       lecture theatre, which an almost-black rectangle does not. -->
  <g stroke="#4a4033" stroke-width="2" opacity="0.75">
    <line x1="0" y1="348" x2="512" y2="348"/>
    <line x1="256" y1="348" x2="256" y2="720"/>
    <line x1="256" y1="348" x2="40" y2="720"/>
    <line x1="256" y1="348" x2="472" y2="720"/>
    <line x1="256" y1="348" x2="-140" y2="720"/>
    <line x1="256" y1="348" x2="652" y2="720"/>
    <line x1="0" y1="404" x2="512" y2="404"/>
    <line x1="0" y1="486" x2="512" y2="486"/>
    <line x1="0" y1="600" x2="512" y2="600"/>
  </g>
  <rect y="348" width="512" height="372" fill="#100d0a" opacity="0.4"/>

  <!-- Training stage floor. -->
  <ellipse cx="256" cy="322" rx="152" ry="26" fill="#332b21"/>
  <ellipse cx="256" cy="322" rx="152" ry="26" fill="none" stroke="#4f4636" stroke-width="2"/>

  <!-- The dummy: it never moves, never blocks, never wins. -->
  <g fill="none" stroke="#93866f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="120" r="30"/>
    <line x1="256" y1="150" x2="256" y2="238"/>
    <line x1="256" y1="176" x2="196" y2="214"/>
    <line x1="256" y1="176" x2="316" y2="214"/>
    <line x1="256" y1="238" x2="216" y2="312"/>
    <line x1="256" y1="238" x2="296" y2="312"/>
  </g>

  <!-- Contact. -->
  <circle cx="290" cy="196" r="26" fill="#b97d1c" opacity="0.5" filter="url(#f-spark)"/>
  <g stroke="#e0a94a" stroke-width="4" stroke-linecap="round">
    <line x1="290" y1="168" x2="290" y2="150"/>
    <line x1="312" y1="178" x2="328" y2="166"/>
    <line x1="316" y1="200" x2="336" y2="202"/>
    <line x1="306" y1="220" x2="318" y2="236"/>
    <line x1="270" y1="176" x2="254" y2="164"/>
  </g>

  <!-- The combo string: five inputs, joined, the fourth one tight. -->
  <line x1="72" y1="440" x2="440" y2="440" stroke="#5f5445" stroke-width="4"/>
  <g>
    <circle cx="72" cy="440" r="26" fill="#261f16" stroke="#c98d2a" stroke-width="4"/>
    <path d="M 72 428 L 72 452 M 72 452 L 64 444 M 72 452 L 80 444"
          stroke="#d9a441" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <circle cx="164" cy="440" r="26" fill="#261f16" stroke="#c98d2a" stroke-width="4"/>
    <path d="M 154 450 L 174 430 M 174 430 L 163 430 M 174 430 L 174 441"
          stroke="#d9a441" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <circle cx="256" cy="440" r="26" fill="#261f16" stroke="#c98d2a" stroke-width="4"/>
    <path d="M 244 440 L 268 440 M 268 440 L 260 432 M 268 440 L 260 448"
          stroke="#d9a441" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <circle cx="348" cy="440" r="26" fill="#241a0c" stroke="#e0a94a" stroke-width="4"/>
    <circle cx="348" cy="440" r="9" fill="#e0a94a"/>

    <circle cx="440" cy="440" r="26" fill="#261f16" stroke="#c98d2a" stroke-width="4"/>
    <circle cx="440" cy="440" r="9" fill="none" stroke="#d9a441" stroke-width="3.5"/>
  </g>

  <!-- The link window on the fourth input: three frames wide. -->
  <path d="M 330 482 L 330 496 L 366 496 L 366 482" fill="none" stroke="#e0a94a" stroke-width="3"/>
  <text x="348" y="530" text-anchor="middle" fill="#e0a94a"
        font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="26">3f</text>

  <!-- One second, drawn honestly: sixty ticks, three of them the window. -->
  <g transform="translate(48 610)">
    <line x1="0" y1="40" x2="416" y2="40" stroke="#5f5445" stroke-width="3"/>
    <g stroke="#897d6c" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="24" x2="0" y2="40"/><line x1="7" y1="30" x2="7" y2="40"/>
      <line x1="14" y1="30" x2="14" y2="40"/><line x1="21" y1="30" x2="21" y2="40"/>
      <line x1="28" y1="30" x2="28" y2="40"/><line x1="35" y1="24" x2="35" y2="40"/>
      <line x1="42" y1="30" x2="42" y2="40"/><line x1="49" y1="30" x2="49" y2="40"/>
      <line x1="56" y1="30" x2="56" y2="40"/><line x1="63" y1="30" x2="63" y2="40"/>
      <line x1="70" y1="24" x2="70" y2="40"/><line x1="77" y1="30" x2="77" y2="40"/>
      <line x1="84" y1="30" x2="84" y2="40"/><line x1="91" y1="30" x2="91" y2="40"/>
      <line x1="98" y1="30" x2="98" y2="40"/><line x1="105" y1="24" x2="105" y2="40"/>
      <line x1="112" y1="30" x2="112" y2="40"/><line x1="119" y1="30" x2="119" y2="40"/>
      <line x1="126" y1="30" x2="126" y2="40"/><line x1="133" y1="30" x2="133" y2="40"/>
      <line x1="140" y1="24" x2="140" y2="40"/><line x1="147" y1="30" x2="147" y2="40"/>
      <line x1="154" y1="30" x2="154" y2="40"/><line x1="161" y1="30" x2="161" y2="40"/>
      <line x1="168" y1="30" x2="168" y2="40"/><line x1="175" y1="24" x2="175" y2="40"/>
      <line x1="182" y1="30" x2="182" y2="40"/><line x1="189" y1="30" x2="189" y2="40"/>
      <line x1="196" y1="30" x2="196" y2="40"/><line x1="203" y1="30" x2="203" y2="40"/>
      <line x1="210" y1="24" x2="210" y2="40"/><line x1="217" y1="30" x2="217" y2="40"/>
      <line x1="224" y1="30" x2="224" y2="40"/><line x1="231" y1="30" x2="231" y2="40"/>
      <line x1="238" y1="30" x2="238" y2="40"/><line x1="245" y1="24" x2="245" y2="40"/>
      <line x1="252" y1="30" x2="252" y2="40"/><line x1="259" y1="30" x2="259" y2="40"/>
      <line x1="266" y1="30" x2="266" y2="40"/><line x1="273" y1="30" x2="273" y2="40"/>
      <line x1="280" y1="24" x2="280" y2="40"/><line x1="287" y1="30" x2="287" y2="40"/>
      <line x1="294" y1="30" x2="294" y2="40"/><line x1="301" y1="30" x2="301" y2="40"/>
      <line x1="308" y1="30" x2="308" y2="40"/><line x1="315" y1="24" x2="315" y2="40"/>
      <line x1="322" y1="30" x2="322" y2="40"/><line x1="329" y1="30" x2="329" y2="40"/>
      <line x1="336" y1="30" x2="336" y2="40"/><line x1="343" y1="30" x2="343" y2="40"/>
      <line x1="350" y1="24" x2="350" y2="40"/><line x1="357" y1="30" x2="357" y2="40"/>
      <line x1="364" y1="30" x2="364" y2="40"/><line x1="371" y1="30" x2="371" y2="40"/>
      <line x1="378" y1="30" x2="378" y2="40"/><line x1="385" y1="24" x2="385" y2="40"/>
      <line x1="392" y1="30" x2="392" y2="40"/><line x1="399" y1="30" x2="399" y2="40"/>
      <line x1="406" y1="30" x2="406" y2="40"/><line x1="413" y1="30" x2="413" y2="40"/>
    </g>
    <rect x="203" y="18" width="22" height="26" fill="#e0a94a" opacity="0.85" rx="2"/>
  </g>
</svg>
