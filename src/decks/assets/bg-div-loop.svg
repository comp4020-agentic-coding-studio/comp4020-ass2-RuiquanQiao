<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     role="img" aria-label="A broken ring of tick marks closing on itself, with a short bright arc where the loop restarts">
  <!-- Divider for the section that stops talking about difficulty and starts
       measuring the loop. The ring is a cycle with a visible seam: the bright
       arc is the retry, and it is short. -->
  <defs>
    <radialGradient id="l-vig" cx="72%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#191410"/>
      <stop offset="60%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#070605"/>
    </radialGradient>
    <linearGradient id="l-arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b97d1c"/>
      <stop offset="100%" stop-color="#e0a94a"/>
    </linearGradient>
    <filter id="l-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#l-vig)"/>

  <g transform="translate(1120 450)">
    <!-- Sixty ticks: one ring, one minute. -->
    <g stroke="#9b9287" stroke-width="4" opacity="0.8">
      <g><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(6)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(12)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(18)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(24)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(30)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(36)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(42)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(48)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(54)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(60)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(66)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(72)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(78)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(84)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(90)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(96)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(102)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(108)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(114)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(120)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(126)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(132)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(138)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(144)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(150)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(156)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(162)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(168)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(174)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(180)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(186)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(192)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(198)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(204)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(210)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(216)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(222)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(228)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(234)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(240)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(246)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(252)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(258)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(264)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(270)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(276)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(282)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(288)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(294)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(300)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(306)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(312)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(318)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(324)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(330)"><line x1="0" y1="-300" x2="0" y2="-282"/></g>
      <g transform="rotate(336)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(342)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(348)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
      <g transform="rotate(354)"><line x1="0" y1="-300" x2="0" y2="-288"/></g>
    </g>

    <!-- The attempt: most of the way round, dim. -->
    <circle r="238" fill="none" stroke="#6b6154" stroke-width="15"
            stroke-dasharray="1200 300" stroke-dashoffset="150" transform="rotate(-90)"/>

    <!-- The retry: a short bright arc where the ring closes. -->
    <circle r="238" fill="none" stroke="url(#l-arc)" stroke-width="17" stroke-linecap="round"
            stroke-dasharray="150 1350" stroke-dashoffset="-1200" transform="rotate(-90)"
            filter="url(#l-glow)" opacity="0.7"/>
    <circle r="238" fill="none" stroke="url(#l-arc)" stroke-width="17" stroke-linecap="round"
            stroke-dasharray="150 1350" stroke-dashoffset="-1200" transform="rotate(-90)"/>

    <!-- The head of the loop, pointing back into itself. -->
    <circle cx="0" cy="-238" r="13" fill="#e0a94a"/>
    <circle cx="0" cy="-238" r="26" fill="none" stroke="#b97d1c" stroke-width="2" opacity="0.5"/>

    <circle r="112" fill="none" stroke="#8a8073" stroke-width="2.5" opacity="0.6"/>
    <circle r="62" fill="none" stroke="#8a8073" stroke-width="2.5" opacity="0.45"/>
  </g>
</svg>
