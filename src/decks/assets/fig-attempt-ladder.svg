<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     role="img" aria-label="Twenty attempts at one boss as a bar chart. Each bar is how far into the fight you got, rising unevenly from under a tenth to the kill on attempt twenty. A gold dot sits above every bar: the single lesson that attempt was short enough to carry. The whole row of twenty costs about thirty-five minutes.">
  <!-- Why the mechanism works, drawn rather than asserted. Two things have to
       be visible at once: the trend goes up, and it does NOT go up
       monotonically (attempts 3, 6, 9, 12, 14 and 16 are worse than the one
       before). A staircase would have been a prettier figure and a false one,
       because the whole claim is that you keep going through the bad ones,
       and you keep going because the dot is still there: a worse attempt
       still hands you a lesson. (No long dashes in here: XML forbids a
       double hyphen inside a comment.)
       Top 170px is deliberately empty: the slide's own h2 sits there. -->
  <rect width="1280" height="720" fill="#0d0d0d"/>

  <!-- The kill line. -->
  <line x1="120" y1="230" x2="1200" y2="230" stroke="#b97d1c" stroke-width="2"
        stroke-dasharray="9 9" opacity="0.65"/>
  <text x="1200" y="222" text-anchor="end" font-family="'Public Sans', system-ui, sans-serif"
        font-size="21" fill="#d9a441">boss dead</text>

  <!-- Baseline. -->
  <line x1="120" y1="600" x2="1200" y2="600" stroke="#8f8478" stroke-width="2" opacity="0.6"/>

  <!-- Twenty attempts. Bar = how far into the fight you got; the dot above it
       is the one thing ninety seconds had room to teach you. -->
  <g>
    <g fill="#5f5445">
      <rect x="137" y="570" width="26" height="30"/>
      <rect x="189" y="556" width="26" height="44"/>
      <rect x="241" y="563" width="26" height="37"/>
      <rect x="293" y="530" width="26" height="70"/>
      <rect x="345" y="519" width="26" height="81"/>
      <rect x="397" y="533" width="26" height="67"/>
      <rect x="449" y="500" width="26" height="100"/>
      <rect x="501" y="485" width="26" height="115"/>
      <rect x="553" y="493" width="26" height="107"/>
      <rect x="605" y="459" width="26" height="141"/>
      <rect x="657" y="437" width="26" height="163"/>
      <rect x="709" y="448" width="26" height="152"/>
      <rect x="761" y="408" width="26" height="192"/>
      <rect x="813" y="419" width="26" height="181"/>
      <rect x="865" y="374" width="26" height="226"/>
      <rect x="917" y="385" width="26" height="215"/>
      <rect x="969" y="341" width="26" height="259"/>
      <rect x="1021" y="319" width="26" height="281"/>
      <rect x="1073" y="274" width="26" height="326"/>
    </g>
    <rect x="1125" y="230" width="26" height="370" fill="#b97d1c"/>

    <g fill="#d9a441">
      <circle cx="150" cy="548" r="7"/>
      <circle cx="202" cy="534" r="7"/>
      <circle cx="254" cy="541" r="7"/>
      <circle cx="306" cy="508" r="7"/>
      <circle cx="358" cy="497" r="7"/>
      <circle cx="410" cy="511" r="7"/>
      <circle cx="462" cy="478" r="7"/>
      <circle cx="514" cy="463" r="7"/>
      <circle cx="566" cy="471" r="7"/>
      <circle cx="618" cy="437" r="7"/>
      <circle cx="670" cy="415" r="7"/>
      <circle cx="722" cy="426" r="7"/>
      <circle cx="774" cy="386" r="7"/>
      <circle cx="826" cy="397" r="7"/>
      <circle cx="878" cy="352" r="7"/>
      <circle cx="930" cy="363" r="7"/>
      <circle cx="982" cy="319" r="7"/>
      <circle cx="1034" cy="297" r="7"/>
      <circle cx="1086" cy="252" r="7"/>
    </g>
  </g>

  <!-- Attempt numbers. -->
  <g font-family="'Public Sans', system-ui, sans-serif" font-size="20" fill="#8f8478"
     text-anchor="middle">
    <text x="150" y="630">1</text>
    <text x="358" y="630">5</text>
    <text x="618" y="630">10</text>
    <text x="878" y="630">15</text>
    <text x="1138" y="630">20</text>
  </g>

  <!-- What the dots are, said once. -->
  <g font-family="'Public Sans', system-ui, sans-serif" font-size="22">
    <line x1="254" y1="534" x2="236" y2="352" stroke="#8f8478" stroke-width="1.5"/>
    <text x="200" y="312" fill="#b3aa9e">one lesson each, and attempt 3 went worse</text>
    <text x="200" y="340" fill="#b3aa9e">than attempt 2, which cost nothing</text>
  </g>

  <!-- The price of the whole row, because it is smaller than anyone guesses. -->
  <text x="1200" y="680" text-anchor="end" font-family="'Public Sans', system-ui, sans-serif"
        font-size="23" fill="#d9a441">20 × (90 s + 15 s) = 35 minutes</text>
  <text x="120" y="680" font-family="'Public Sans', system-ui, sans-serif" font-size="20"
        fill="#8f8478">how far into the fight you got</text>
</svg>
